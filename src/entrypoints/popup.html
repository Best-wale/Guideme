<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Site Guide</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        width: 300px;
        padding: 16px;
        background: #f9fafb;
        color: #1f2937;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 12px;
        color: #3b82f6;
      }

      .info {
        background: #f0f9ff;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
        border-left: 4px solid #3b82f6;
      }

      .shortcut {
        background: white;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .shortcut-key {
        background: #f3f4f6;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
        font-weight: 500;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
      }

      button:hover {
        background: #2563eb;
      }

      .status {
        font-size: 12px;
        margin-top: 12px;
        padding: 8px;
        background: #d1fae5;
        border-radius: 6px;
        color: #065f46;
        display: none;
      }

      .status.error {
        background: #fee2e2;
        color: #7f1d1d;
      }
    </style>
  </head>
  <body>
    <h1>🤖 AI Site Guide</h1>

    <div class="info">
      Press <span class="shortcut-key">Ctrl+Shift+G</span> (or <span class="shortcut-key">Cmd+Shift+G</span> on Mac) to toggle the chat bubble on any website.
    </div>

    <div class="shortcut">
      <strong>Quick Tips:</strong>
      <ul style="margin-left: 20px; margin-top: 8px;">
        <li>Ask for guidance on any website</li>
        <li>Use voice input with 🎤</li>
        <li>Follow visual step-by-step guides</li>
      </ul>
    </div>

    <button id="settings-btn">Open Settings</button>
    <button id="help-btn">View Help</button>

    <div id="status" class="status"></div>

    <script src="./popup.js"></script>
  </body>
</html>
